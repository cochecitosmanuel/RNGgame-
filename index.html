<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RNG: tira y colecciona</title>
<meta name="description" content="Un juego de azar puro: tira, descubre rarezas de 1 entre un millón y completa tu colección.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14112e;
    --bg-deep: #0e0b22;
    --panel: #1e1a45;
    --line: #382f76;
    --text: #ece9ff;
    --muted: #a8a2d8;
    --accent: #7c5cff;
    --accent-hover: #9079ff;
    --ok: #63d391;
    --font: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg-deep); }
  body {
    margin: 0; min-height: 100vh;
    font-family: var(--font); font-size: 1rem; line-height: 1.5;
    color: var(--text);
    background: radial-gradient(ellipse at 20% -10%, #2a2266 0%, var(--bg) 45%, var(--bg-deep) 100%);
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 56px; }

  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .wallet { text-align: right; }
  .wallet .num { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .wallet .lbl { color: var(--muted); font-size: .85rem; }

  .grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .panel h2 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 600; color: var(--muted); }

  /* ---- Resultado ---- */
  #resultado {
    --c: #55507f; --g: 0;
    min-height: 210px;
    padding: 22px;
    border-radius: 12px;
    background: var(--bg-deep);
    border: 2px solid var(--c);
    box-shadow: 0 0 calc(var(--g) * 7px) calc(var(--g) * 1px) var(--c);
    display: flex; flex-direction: column; justify-content: center; gap: 4px;
  }
  #resultado.pop { animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: scale(.94); } 60% { transform: scale(1.02); } 100% { transform: scale(1); } }
  #rTier { font-size: clamp(2rem, 7vw, 3.3rem); font-weight: 800; letter-spacing: -0.03em; color: var(--c); line-height: 1.05; }
  #rItem { font-size: 1.35rem; font-weight: 600; }
  #rInfo { color: var(--muted); font-size: .95rem; }
  .nuevo { display: inline-block; margin-left: 8px; padding: 1px 9px; border-radius: 99px; background: var(--ok); color: #06301a; font-size: .8rem; font-weight: 800; vertical-align: middle; }

  .roll-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 18px; }
  button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; transition: background .15s, opacity .15s, transform .08s; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid #ffd76a; outline-offset: 3px; }
  #btnTirar { font-size: 1.4rem; padding: 16px 44px; border: 0; background: var(--accent); color: #fff; }
  #btnTirar:hover:not(:disabled) { background: var(--accent-hover); }
  .ghost { padding: 10px 16px; background: transparent; color: var(--text); border: 1px solid var(--line); }
  .ghost:hover:not(:disabled) { background: rgba(255,255,255,.06); }
  .ghost[aria-pressed="true"] { background: var(--ok); color: #06301a; border-color: var(--ok); }
  .cool { height: 6px; margin-top: 14px; border-radius: 99px; background: var(--bg-deep); overflow: hidden; }
  .cool > div { height: 100%; width: 100%; background: var(--accent); }
  .hint { margin: 10px 0 0; font-size: .85rem; color: var(--muted); }
  kbd { font: inherit; font-size: .8em; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg-deep); }

  .hist { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 18px; min-height: 30px; }
  .chip { padding: 3px 10px; border-radius: 99px; font-size: .82rem; font-weight: 600; border: 1px solid currentColor; }

  /* ---- Estadísticas y mejoras ---- */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--bg-deep); border-radius: 8px; padding: 10px 12px; }
  .stat .v { font-weight: 800; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: .8rem; color: var(--muted); }
  .up { padding: 12px 0; border-top: 1px solid var(--line); }
  .up:first-of-type { border-top: 0; }
  .up-head { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
  .up-head small { color: var(--muted); font-weight: 400; }
  .up-desc { margin: 2px 0 8px; color: var(--muted); font-size: .88rem; }
  .buy { width: 100%; padding: 8px 12px; background: var(--text); color: var(--bg-deep); border: 0; }
  .buy:hover:not(:disabled) { background: #fff; }
  .reset { margin-top: 16px; font-size: .85rem; padding: 6px 12px; }

  /* ---- Colección ---- */
  .col { margin-top: 18px; }
  .tier { padding: 14px 0; border-top: 1px solid var(--line); }
  .tier:first-of-type { border-top: 0; }
  .tier-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 8px; }
  .tier-head strong { font-size: 1.05rem; }
  .tier-head span { color: var(--muted); font-size: .85rem; }
  .items { display: flex; flex-wrap: wrap; gap: 8px; }
  .item { padding: 6px 12px; border-radius: 8px; background: var(--bg-deep); border: 1px solid var(--line); font-size: .9rem; }
  .item.off { color: #6d67a0; border-style: dashed; }
  .item small { color: var(--muted); margin-left: 6px; }

  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
    .wallet { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) {
    #resultado.pop { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RNG</h1>
    <div class="wallet">
      <div class="num" id="monedas">0</div>
      <div class="lbl">monedas</div>
    </div>
  </header>

  <div class="grid">
    <section class="panel" aria-label="Tirada">
      <div id="resultado" aria-live="polite">
        <div id="rTier">Tira para empezar</div>
        <div id="rItem">Lo que salga depende solo del azar.</div>
        <div id="rInfo"></div>
      </div>

      <div class="cool" aria-hidden="true"><div id="coolBar"></div></div>

      <div class="roll-row">
        <button id="btnTirar" type="button">Tirar</button>
        <button id="btnAuto" class="ghost" type="button" aria-pressed="false" hidden>Tirada automática: no</button>
      </div>
      <p class="hint">Pulsa <kbd>Espacio</kbd> para tirar.</p>

      <div class="hist" id="hist" aria-label="Últimas tiradas"></div>
    </section>

    <aside class="panel" aria-label="Progreso y mejoras">
      <div class="stats">
        <div class="stat"><div class="v" id="sTiradas">0</div><div class="k">tiradas</div></div>
        <div class="stat"><div class="v" id="sSuerte">×1,00</div><div class="k">suerte</div></div>
        <div class="stat"><div class="v" id="sMejor">—</div><div class="k">mejor rareza</div></div>
        <div class="stat"><div class="v" id="sColeccion">0/0</div><div class="k">colección</div></div>
      </div>
      <h2>Mejoras</h2>
      <div id="mejoras"></div>
      <button class="ghost reset" id="btnReset" type="button">Reiniciar progreso</button>
    </aside>
  </div>

  <section class="panel col" aria-label="Colección">
    <h2>Colección</h2>
    <div id="coleccion"></div>
  </section>
</div>

<script>
(() => {
  "use strict";

  // ---------- Datos ----------
  // odds = "1 entre N" con suerte ×1. Común es lo que queda cuando no sale nada mejor.
  const TIERS = [
    { nombre: "Común",      odds: 1,       valor: 1,      color: "#b4bcc8", items: ["Piedra", "Ramita", "Hoja seca", "Trébol"] },
    { nombre: "Poco común", odds: 5,       valor: 3,      color: "#63d391", items: ["Cuarzo", "Pluma", "Luciérnaga", "Concha"] },
    { nombre: "Rara",       odds: 20,      valor: 12,     color: "#5ba8ff", items: ["Zafiro", "Aurora", "Eco de trueno", "Marea"] },
    { nombre: "Épica",      odds: 100,     valor: 60,     color: "#b47cff", items: ["Eclipse", "Fénix menor", "Espectro", "Runa viva"] },
    { nombre: "Legendaria", odds: 1000,    valor: 400,    color: "#ffbf3c", items: ["Sol de bolsillo", "Dragón dormido", "Corona rota"] },
    { nombre: "Mítica",     odds: 10000,   valor: 3000,   color: "#ff5c8a", items: ["Nebulosa", "Guardián del tiempo", "Llama azul"] },
    { nombre: "Divina",     odds: 100000,  valor: 25000,  color: "#4df0e6", items: ["Aliento del alba", "Reloj del cosmos"] },
    { nombre: "Cósmica",    odds: 1000000, valor: 250000, color: "#ffffff", items: ["El Dado Primigenio"] },
  ];

  const MEJORAS = [
    { id: "suerte",    nombre: "Suerte",            max: 30, base: 25,  crece: 1.45,
      efecto: n => `Rarezas ×${dec(1 + 0.25 * n)} más probables` },
    { id: "velocidad", nombre: "Velocidad",         max: 10, base: 40,  crece: 1.7,
      efecto: n => `Espera entre tiradas: ${dec(cooldownDe(n) / 1000)} s` },
    { id: "monedas",   nombre: "Valor de las monedas", max: 20, base: 60, crece: 1.55,
      efecto: n => `Ganas ×${dec(1 + 0.5 * n)} monedas por tirada` },
    { id: "auto",      nombre: "Tirada automática", max: 1,  base: 500, crece: 1,
      efecto: n => n ? "Desbloqueada" : "Tira sola cuando termina la espera" },
  ];

  // ---------- Utilidades ----------
  const $ = id => document.getElementById(id);
  const fmt = n => Number(n).toLocaleString("es-ES");
  const dec = n => n.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const cooldownDe = n => Math.max(150, 1200 - 105 * n);
  const coste = (m, n) => Math.round(m.base * Math.pow(m.crece, n));
  const totalItems = TIERS.reduce((s, t) => s + t.items.length, 0);

  // ---------- Guardado ----------
  const CLAVE = "rng-coleccion-v1";
  const inicial = () => ({
    monedas: 0, tiradas: 0, mejorTier: -1, autoOn: false,
    mejoras: { suerte: 0, velocidad: 0, monedas: 0, auto: 0 },
    encontrados: {}, historial: [],
  });
  function cargar() {
    try {
      const s = JSON.parse(localStorage.getItem(CLAVE));
      if (s && s.mejoras) return { ...inicial(), ...s, mejoras: { ...inicial().mejoras, ...s.mejoras } };
    } catch (e) {}
    return null;
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(est)); } catch (e) {} }

  let est = cargar() || inicial();
  let listo = true;
  let temporizador = null;

  const suerte = () => 1 + 0.25 * est.mejoras.suerte;
  const cooldown = () => cooldownDe(est.mejoras.velocidad);
  const multMonedas = () => 1 + 0.5 * est.mejoras.monedas;

  // ---------- Azar ----------
  function elegirTier() {
    const L = suerte();
    for (let i = TIERS.length - 1; i > 0; i--) {
      if (Math.random() < Math.min(1, L / TIERS[i].odds)) return i;
    }
    return 0;
  }

  // ---------- Tirada ----------
  function tirar() {
    if (!listo) return;
    listo = false;

    const ti = elegirTier();
    const T = TIERS[ti];
    const ii = Math.floor(Math.random() * T.items.length);
    const ganancia = Math.round(T.valor * multMonedas());

    const clave = ti + ":" + ii;
    const nuevo = !est.encontrados[clave];
    est.encontrados[clave] = (est.encontrados[clave] || 0) + 1;
    est.monedas += ganancia;
    est.tiradas++;
    if (ti > est.mejorTier) est.mejorTier = ti;
    est.historial.unshift({ t: ti, n: T.items[ii] });
    est.historial.length = Math.min(est.historial.length, 12);

    mostrarResultado(ti, ii, ganancia, nuevo);
    refrescar();
    guardar();
    iniciarEspera();
  }

  function mostrarResultado(ti, ii, ganancia, nuevo) {
    const T = TIERS[ti];
    const box = $("resultado");
    box.style.setProperty("--c", T.color);
    box.style.setProperty("--g", String(ti + 1));
    $("rTier").textContent = T.nombre;
    $("rItem").textContent = T.items[ii];
    const info = $("rInfo");
    info.textContent = (ti === 0 ? "La mayoría de las veces" : `Probabilidad base: 1 entre ${fmt(T.odds)}`) + ` · +${fmt(ganancia)} monedas`;
    if (nuevo) {
      const b = document.createElement("span");
      b.className = "nuevo";
      b.textContent = "Nuevo";
      $("rItem").append(b);
    }
    box.classList.remove("pop");
    void box.offsetWidth;
    box.classList.add("pop");
  }

  function iniciarEspera() {
    const bar = $("coolBar"), cd = cooldown();
    bar.style.transition = "none";
    bar.style.width = "0%";
    void bar.offsetWidth;
    bar.style.transition = `width ${cd}ms linear`;
    bar.style.width = "100%";
    $("btnTirar").disabled = true;
    clearTimeout(temporizador);
    temporizador = setTimeout(() => {
      listo = true;
      $("btnTirar").disabled = false;
      if (est.autoOn && est.mejoras.auto) tirar();
    }, cd);
  }

  // ---------- Mejoras ----------
  function comprar(id) {
    const m = MEJORAS.find(x => x.id === id);
    const n = est.mejoras[id];
    if (n >= m.max) return;
    const c = coste(m, n);
    if (est.monedas < c) return;
    est.monedas -= c;
    est.mejoras[id]++;
    if (id === "auto") est.autoOn = true;
    refrescar();
    guardar();
    if (id === "auto" && listo) tirar();
  }

  // ---------- Interfaz ----------
  function construir() {
    const cont = $("mejoras");
    cont.innerHTML = "";
    MEJORAS.forEach(m => {
      const d = document.createElement("div");
      d.className = "up";
      d.innerHTML = `<div class="up-head"><span>${m.nombre}</span><small id="nivel-${m.id}"></small></div>
        <p class="up-desc" id="desc-${m.id}"></p>
        <button class="buy" id="buy-${m.id}" type="button"></button>`;
      cont.append(d);
      d.querySelector("button").addEventListener("click", () => comprar(m.id));
    });

    const col = $("coleccion");
    col.innerHTML = "";
    TIERS.forEach((T, ti) => {
      const s = document.createElement("div");
      s.className = "tier";
      s.innerHTML = `<div class="tier-head"><strong style="color:${T.color}">${T.nombre}</strong>
        <span id="odds-${ti}"></span><span id="prog-${ti}"></span></div><div class="items" id="items-${ti}"></div>`;
      col.append(s);
      const cont2 = s.querySelector(".items");
      T.items.forEach((_, ii) => {
        const it = document.createElement("div");
        it.className = "item";
        it.id = `item-${ti}-${ii}`;
        cont2.append(it);
      });
    });
  }

  function refrescar() {
    $("monedas").textContent = fmt(est.monedas);
    $("sTiradas").textContent = fmt(est.tiradas);
    $("sSuerte").textContent = "×" + dec(suerte());
    const mejor = est.mejorTier >= 0 ? TIERS[est.mejorTier] : null;
    $("sMejor").textContent = mejor ? mejor.nombre : "—";
    $("sMejor").style.color = mejor ? mejor.color : "";
    $("sColeccion").textContent = `${Object.keys(est.encontrados).length}/${totalItems}`;

    MEJORAS.forEach(m => {
      const n = est.mejoras[m.id];
      const maxed = n >= m.max;
      $("nivel-" + m.id).textContent = m.max > 1 ? `nivel ${n}/${m.max}` : "";
      $("desc-" + m.id).textContent = m.efecto(n);
      const b = $("buy-" + m.id);
      if (maxed) { b.textContent = m.max > 1 ? "Nivel máximo" : "Comprada"; b.disabled = true; }
      else { const c = coste(m, n); b.textContent = `Comprar por ${fmt(c)} monedas`; b.disabled = est.monedas < c; }
    });

    const auto = $("btnAuto");
    auto.hidden = !est.mejoras.auto;
    auto.setAttribute("aria-pressed", String(est.autoOn));
    auto.textContent = "Tirada automática: " + (est.autoOn ? "sí" : "no");

    TIERS.forEach((T, ti) => {
      $("odds-" + ti).textContent = ti === 0 ? "el resto de tiradas" : `1 entre ${fmt(Math.round(T.odds / suerte()))}`;
      let vistos = 0;
      T.items.forEach((nombre, ii) => {
        const n = est.encontrados[ti + ":" + ii];
        const el = $(`item-${ti}-${ii}`);
        if (n) {
          vistos++;
          el.className = "item";
          el.innerHTML = "";
          el.append(nombre);
          const s = document.createElement("small");
          s.textContent = "×" + fmt(n);
          el.append(s);
        } else {
          el.className = "item off";
          el.textContent = "???";
        }
      });
      $("prog-" + ti).textContent = `${vistos}/${T.items.length}`;
    });

    const h = $("hist");
    h.innerHTML = "";
    est.historial.forEach(x => {
      const c = document.createElement("span");
      c.className = "chip";
      c.style.color = TIERS[x.t].color;
      c.textContent = x.n;
      h.append(c);
    });
  }

  // ---------- Eventos ----------
  $("btnTirar").addEventListener("click", tirar);
  $("btnAuto").addEventListener("click", () => {
    est.autoOn = !est.autoOn;
    refrescar();
    guardar();
    if (est.autoOn && listo) tirar();
  });
  $("btnReset").addEventListener("click", () => {
    if (!confirm("¿Borrar todo tu progreso? No se puede deshacer.")) return;
    est = inicial();
    listo = true;
    clearTimeout(temporizador);
    $("btnTirar").disabled = false;
    $("coolBar").style.transition = "none";
    $("coolBar").style.width = "100%";
    const box = $("resultado");
    box.style.setProperty("--c", "#55507f");
    box.style.setProperty("--g", "0");
    $("rTier").textContent = "Tira para empezar";
    $("rItem").textContent = "Lo que salga depende solo del azar.";
    $("rInfo").textContent = "";
    refrescar();
    guardar();
  });
  document.addEventListener("keydown", e => {
    if (e.code !== "Space" || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.closest("button")) return; // el botón ya gestiona Espacio
    e.preventDefault();
    tirar();
  });

  construir();
  refrescar();
})();
</script>
</body>
</html>
