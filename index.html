<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omni RNG 2D con Imágenes</title>
  <style>
    :root {
      --bg-color: #090d16;
      --card-color: #131c2e;
      --accent-color: #38bdf8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 { margin-bottom: 5px; text-align: center; }
    .stats-bar { display: flex; gap: 20px; color: #94a3b8; margin-bottom: 15px; }

    /* Carta Principal */
    .card-container { perspective: 1000px; margin-bottom: 20px; }

    .card {
      width: 250px;
      height: 350px;
      background-color: var(--card-color);
      border-radius: 16px;
      border: 4px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s, border-color 0.3s, box-shadow 0.3s;
      text-align: center;
      padding: 15px;
      box-sizing: border-box;
    }

    .card.shake { animation: pop 0.25s ease-in-out; }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .card-image-box {
      width: 100%;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      overflow: hidden;
    }

    .card-image-box img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .card-category { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; }
    .card-title { font-size: 18px; font-weight: bold; margin: 5px 0; }
    .card-rarity { font-size: 13px; font-weight: bold; }

    /* Botón */
    button {
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 25px;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background-color: #7dd3fc; transform: scale(1.05); }

    /* Enciclopedia */
    .album-title { margin-top: 10px; border-bottom: 2px solid #334155; width: 100%; max-width: 600px; text-align: center; padding-bottom: 10px; }
    .album {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 600px;
      margin-top: 15px;
      max-height: 350px;
      overflow-y: auto;
    }

    .album-item {
      background-color: #131c2e;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      font-size: 10px;
      border: 2px solid #334155;
      opacity: 0.25;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .album-item img { width: 40px; height: 40px; object-fit: contain; margin-bottom: 4px; }
    .album-item.unlocked { opacity: 1; }
  </style>
</head>
<body>

  <h1>🌍 Omni RNG 2D</h1>
  <div class="stats-bar">
    <div>Tiradas: <span id="total-rolls">0</span></div>
  </div>

  <!-- Carta con Imagen Real -->
  <div class="card-container">
    <div class="card" id="main-card">
      <div class="card-category" id="card-category">RNG General</div>
      <div class="card-image-box">
        <img id="card-img" src="https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcQuZpBwkJcGo0RL8_4JuaA8O9fwGVNkaibDq02boNGNyKRmiU6_GLO2poMm1DUp7uHkOmFS9DId4megdJE" alt="Objeto">
      </div>
      <div class="card-title" id="card-title">Pulsa Tirar</div>
      <div class="card-rarity" id="card-rarity">1 en 1</div>
    </div>
  </div>

  <button onclick="roll()">🎲 ¡TIRAR OBJETO!</button>

  <h2 class="album-title">Colección (<span id="unlocked-count">0</span>/<span id="total-count">0</span>)</h2>
  <div class="album" id="album"></div>

  <script>
    const ITEMS = [
      { name: "Lápiz", category: "Escuela", chance: 2, img: "https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcQuZpBwkJcGo0RL8_4JuaA8O9fwGVNkaibDq02boNGNyKRmiU6_GLO2poMm1DUp7uHkOmFS9DId4megdJE", color: "#a1a1aa" },
      { name: "Coche Deportivo", category: "Vehículos", chance: 350, img: "https://encrypted-tbn3.gstatic.com/licensed-image?q=tbn:ANd9GcSyFxZCnVRISSZBd1-tvIDoP6fmWRS3dTMnII6a8axiFcXESd6TJS3oWTCpNC6NpAeoHhhk2e7mQJ1VaRk", color: "#fde047" },
      { name: "Cohete Espacial", category: "Especial", chance: 100000, img: "https://encrypted-tbn3.gstatic.com/licensed-image?q=tbn:ANd9GcQ5DjoD6JK2vOYyYAuis0EyQ5_vtXtVCEIq6v0B7Oefw0bLKJP-ERpRAsmjXKfttq5d7iHPX7XeyfqC1Y4", color: "#38bdf8" },
      { name: "Agujero Negro", category: "Mítico", chance: 1000000, img: "https://encrypted-tbn2.gstatic.com/licensed-image?q=tbn:ANd9GcT4pxHlsHJh6rZGLTLoy1IwVeKJvdBY2igvtXSk2-qurkP7DRSmGFVPWcZDHNqIxhOb02Qkn3rxDCAjXiU", color: "#e879f9" }
    ];

    let totalRolls = parseInt(localStorage.getItem("omni_rolls_img")) || 0;
    let unlocked = new Set(JSON.parse(localStorage.getItem("omni_unlocked_img")) || []);

    document.getElementById("total-rolls").innerText = totalRolls;
    document.getElementById("total-count").innerText = ITEMS.length;

    const albumEl = document.getElementById("album");
    ITEMS.forEach((item, index) => {
      const el = document.createElement("div");
      el.className = `album-item ${unlocked.has(index) ? 'unlocked' : ''}`;
      el.id = `album-${index}`;
      if (unlocked.has(index)) el.style.borderColor = item.color;
      el.innerHTML = `<img src="${item.img}"><div><b>${item.name}</b></div><div>1/${item.chance.toLocaleString()}</div>`;
      albumEl.appendChild(el);
    });
    document.getElementById("unlocked-count").innerText = unlocked.size;

    function roll() {
      totalRolls++;
      document.getElementById("total-rolls").innerText = totalRolls;

      const rand = Math.random();
      const sorted = [...ITEMS].sort((a, b) => b.chance - a.chance);

      let selected = ITEMS[0];
      for (let item of sorted) {
        if (rand < (1 / item.chance)) {
          selected = item;
          break;
        }
      }

      const cardEl = document.getElementById("main-card");
      cardEl.classList.remove("shake");
      void cardEl.offsetWidth;
      cardEl.classList.add("shake");

      document.getElementById("card-category").innerText = selected.category;
      document.getElementById("card-img").src = selected.img;
      document.getElementById("card-title").innerText = selected.name;
      document.getElementById("card-rarity").innerText = `1 en ${selected.chance.toLocaleString()}`;
      document.getElementById("card-rarity").style.color = selected.color;
      
      cardEl.style.borderColor = selected.color;
      cardEl.style.boxShadow = `0 0 25px ${selected.color}aa`;

      const index = ITEMS.findIndex(i => i.name === selected.name);
      if (!unlocked.has(index)) {
        unlocked.add(index);
        const albumItem = document.getElementById(`album-${index}`);
        albumItem.classList.add("unlocked");
        albumItem.style.borderColor = selected.color;
        document.getElementById("unlocked-count").innerText = unlocked.size;
      }

      localStorage.setItem("omni_rolls_img", totalRolls);
      localStorage.setItem("omni_unlocked_img", JSON.stringify(Array.from(unlocked)));
    }
  </script>
</body>
</html>
